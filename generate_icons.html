<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Generador de Íconos PWA</title>
</head>
<body style="font-family: sans-serif; padding: 20px; text-align: center;">
  <h2>Generador de Íconos PNG para PWA</h2>
  <p>Haz clic en los botones para descargar los íconos necesarios para tu aplicación:</p>
  <canvas id="c192" width="192" height="192" style="border:1px solid #ccc; margin:10px;"></canvas>
  <canvas id="c512" width="512" height="512" style="border:1px solid #ccc; margin:10px;"></canvas>
  <br>
  <button id="btn192" style="padding:10px 20px; font-weight:bold; margin:10px; cursor:pointer;">Descargar icon-192.png</button>
  <button id="btn512" style="padding:10px 20px; font-weight:bold; margin:10px; cursor:pointer;">Descargar icon-512.png</button>

  <script>
    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d');
      // Background gradient
      const grad = ctx.createLinearGradient(0, 0, size, size);
      grad.addColorStop(0, '#14213d');
      grad.addColorStop(1, '#26385f');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(0, 0, size, size, size * 0.15);
      ctx.fill();

      // Flame symbol
      ctx.fillStyle = '#e4572e';
      ctx.beginPath();
      const cx = size / 2, cy = size / 2;
      ctx.moveTo(cx, cy - size * 0.25);
      ctx.bezierCurveTo(cx + size * 0.25, cy - size * 0.05, cx + size * 0.25, cy + size * 0.25, cx, cy + size * 0.28);
      ctx.bezierCurveTo(cx - size * 0.25, cy + size * 0.25, cx - size * 0.25, cy - size * 0.05, cx, cy - size * 0.25);
      ctx.fill();

      // Inner flame
      ctx.fillStyle = '#f1c40f';
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.bezierCurveTo(cx + size * 0.1, cy + size * 0.1, cx + size * 0.1, cy + size * 0.2, cx, cy + size * 0.22);
      ctx.bezierCurveTo(cx - size * 0.1, cy + size * 0.2, cx - size * 0.1, cy + size * 0.1, cx, cy);
      ctx.fill();
    }

    const c192 = document.getElementById('c192');
    const c512 = document.getElementById('c512');
    drawIcon(c192, 192);
    drawIcon(c512, 512);

    document.getElementById('btn192').onclick = () => {
      const a = document.createElement('a');
      a.download = 'icon-192.png';
      a.href = c192.toDataURL('image/png');
      a.click();
    };

    document.getElementById('btn512').onclick = () => {
      const a = document.createElement('a');
      a.download = 'icon-512.png';
      a.href = c512.toDataURL('image/png');
      a.click();
    };
  </script>
</body>
</html>
